<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>赛博胡同 · 登录页预览</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#24372f;background:#d8d7d0;font-family:"Microsoft YaHei",sans-serif}.scene{position:fixed;inset:0;background-image:url('./login-office-background.png');background-size:auto max(180vh,1100px);background-position:50% 34%;image-rendering:pixelated}.layout{position:relative;min-height:100svh;display:grid;place-items:center;padding:45px 20px 75px}.wall{width:min(340px,100%)}h1{text-align:center;font-family:SimHei,"Microsoft YaHei",sans-serif;font-size:46px;letter-spacing:7px;margin:0 0 28px;text-shadow:2px 3px #b4b8b0}nav{display:flex;justify-content:center;gap:30px;margin-bottom:22px}button,input{font:inherit}nav button,.link{border:0;background:none;color:#526158;cursor:pointer;padding:7px 0}nav button[aria-current=true]{color:#203e32;border-bottom:3px solid #254d3d;font-weight:bold}label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;height:42px;border:1px solid #9ca79e;border-radius:0;background:#fafaf3e8;padding:0 12px;color:#263a30;outline-offset:3px}input:focus{outline:2px solid #366e53}.primary{margin-top:22px;width:100%;height:44px;background:#254d3d;color:#fffdf0;border:2px solid #183629;box-shadow:3px 3px #7b867a;cursor:pointer}.links{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px}.note{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:white;background:#22372fc9;padding:7px}#message{font-size:12px;line-height:1.7;background:#e9ece3;padding:10px;margin-top:12px}#message:empty{display:none}h2{font-size:18px;text-align:center;margin:0 0 18px}.hint{font-size:12px;line-height:1.7;color:#58665d}button:focus-visible{outline:2px solid #254d3d;outline-offset:4px}@media(max-width:600px){h1{font-size:38px}.scene{background-size:auto max(190vh,1250px);background-position:49% 31%}.layout{padding-top:30px}}
</style>
<div class="scene" aria-hidden="true"></div><main class="layout"><section class="wall" aria-label="账号入口"><h1>赛博胡同</h1><nav aria-label="账号操作"><button type="button" data-mode="login">登录</button><button type="button" data-mode="register">注册</button></nav><form id="form"></form><p id="message" role="status"></p></section></main><div class="note">界面预览 · 尚未连接账号服务，请使用示例信息体验</div>
<script>
const form=document.querySelector('#form'),message=document.querySelector('#message');let mode='login';
const field=(id,label,type='text',auto='off')=>`<label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" autocomplete="${auto}" required ${type==='password'?'minlength="10"':''}>`;
function render(next){mode=next;message.textContent='';document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.mode===mode)));let body=mode==='forgot'?'<h2>忘记密码</h2>':mode==='reset'?'<h2>设置新密码</h2>':'';body+=field('name','英文名','text','username');if(mode==='register')body+=field('code','专属领取码');if(mode==='reset')body+=field('code','重置码');if(mode!=='forgot')body+=field('password',mode==='login'?'密码':'设置密码（至少 10 位）','password',mode==='login'?'current-password':'new-password');if(mode==='register'||mode==='reset')body+=field('confirm','确认密码','password','new-password');if(mode==='forgot')body+='<p class="hint">提交申请后，由管理员核对身份并提供重置码。</p>';body+=`<button class="primary" type="submit">${{login:'进入胡同',register:'注册并领取角色',forgot:'申请重置',reset:'确认新密码'}[mode]}</button><div class="links"><button class="link" type="button" data-mode="${mode==='login'?'forgot':'login'}">${mode==='login'?'忘记密码？':'返回登录'}</button>${mode==='forgot'?'<button class="link" type="button" data-mode="reset">已有重置码</button>':''}</div>`;form.innerHTML=body;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)render(b.dataset.mode)});
form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);if(d.has('confirm')&&d.get('confirm')!==d.get('password')){message.textContent='两次密码不一致。';return}message.textContent={login:'预览：正式版将验证英文名与密码，加载你已绑定的角色。',register:'预览：正式版将验证英文名与领取码，注册成功后绑定唯一角色。',forgot:'预览：正式版将在后台记录重置申请，由管理员处理。',reset:'预览：正式版将验证重置码、更新密码，并使旧会话失效。'}[mode];form.querySelectorAll('input[type=password]').forEach(i=>i.value='');});render('login');
</script></html>
